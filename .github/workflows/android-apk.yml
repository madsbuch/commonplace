name: Android APK

# Spec: ENG-5
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle distribution and dependencies between runs, so a
      # build doesn't hinge on services.gradle.org answering in time.
      - uses: gradle/actions/setup-gradle@v5

      # The NDK is a large download; keep it between runs. (ANDROID_HOME is
      # /usr/local/lib/android/sdk on GitHub's Ubuntu runners.)
      - name: Cache Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.0.12674087
          key: android-ndk-28.0.12674087

      - name: Install Android NDK
        run: |
          if [ "${{ steps.ndk.outputs.cache-hit }}" != "true" ]; then
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.12674087"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.12674087" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12674087" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Compiler outputs, crate by crate, in GitHub's cache. Tauri's build
      # scripts re-run when the CLI and Gradle (or the two macOS targets)
      # build with different settings, so cargo's own target folder holds one
      # variant at a time; sccache keeps them all.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tools/sqlite-android-compat
          shared-key: android
          # Keep what compiled even when a later step fails.
          cache-on-failure: true

      # Every migration, the sync triggers especially, has to parse and
      # behave on Android 14's SQLite (3.39), the oldest an Android device of
      # ours runs.
      - name: Check migrations on Android's SQLite
        run: cargo run --quiet --manifest-path tools/sqlite-android-compat/Cargo.toml -- .

      # Bun's package cache, keyed on the lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Until the generated Android project is committed, generate it from
      # Tauri's template and give it release signing. Both steps leave a
      # committed project as it is.
      - name: Generate Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bun run tauri android init --ci
          fi
          bun scripts/android-signing.mjs
          bun scripts/android-icons.mjs

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE secret not set - building an unsigned APK"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$KEY_ALIAS
          password=$KEYSTORE_PASSWORD
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      # The wrapper's own download has a short timeout and no retry; fetch it
      # here with retries so a slow mirror doesn't fail the whole build.
      - name: Fetch Gradle
        working-directory: src-tauri/gen/android
        run: |
          for i in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying…"
            sleep $((i * 15))
          done
          exit 1

      # Gradle resolves its dependencies inside this step, so a download that
      # still times out after its own retries gets one more try here. The
      # Rust side is already built by then, so a second attempt is quick.
      - name: Build APK
        run: |
          for i in 1 2; do
            bun run tauri android build --apk --target aarch64 && exit 0
            echo "APK build failed (attempt $i)"
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: commonplace-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

      # Only the release's files change; its tag stays put. Moving the tag
      # with git is refused whenever the commit changes a workflow file
      # (the job's token may not touch workflows), and the files don't need it.
      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automated builds from main. Updated on every push." || \
            gh release view latest >/dev/null
          gh release upload latest \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk --clobber
          gh release edit latest --notes "Automated builds from main, updated on every push. These files are from $GITHUB_SHA."

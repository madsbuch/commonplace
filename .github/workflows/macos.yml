name: macOS app

# Spec: ENG-5
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Both architectures, so one universal build runs on Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Compiler outputs, crate by crate, in GitHub's cache. Tauri's build
      # scripts re-run when the CLI and Gradle (or the two macOS targets)
      # build with different settings, so cargo's own target folder holds one
      # variant at a time; sccache keeps them all.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos
          # Keep what compiled even when a later step fails.
          cache-on-failure: true

      # Bun's package cache, keyed on the lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Spec: ENG-7
      # Signed ad hoc (bundle.macOS.signingIdentity "-" in tauri.conf.json):
      # an unsigned app is kept off the local network without macOS asking.
      # Not notarized: Gatekeeper asks the user to allow it on first launch
      # (right-click → Open). Add APPLE_CERTIFICATE / APPLE_ID secrets and the
      # matching env vars here to sign with a certificate and notarize.
      - name: Build app
        run: bun run tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v6
        with:
          name: commonplace-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Adds the DMG to the "latest" release, creating it if this job finishes first.
      - name: Publish DMG to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automated builds from main. Updated on every push." || \
            gh release view latest >/dev/null
          gh release upload latest \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

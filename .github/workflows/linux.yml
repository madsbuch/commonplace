name: Linux app

# Spec: ENG-5
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Tauri's WebKitGTK and friends. 22.04 keeps the AppImage's glibc old
      # enough to run on most distributions.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v6
        with:
          name: my-book-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # The Android workflow owns the "latest" tag; this only adds the Linux
      # builds to the same release, creating it if this job finishes first.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automated builds from main. Updated on every push." || \
            gh release view latest >/dev/null
          gh release upload latest \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber

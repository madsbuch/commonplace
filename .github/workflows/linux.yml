name: Linux app

# Spec: ENG-5
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Tauri's WebKitGTK and friends. 22.04 keeps the AppImage's glibc old
      # enough to run on most distributions.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      # Compiler outputs, crate by crate, in GitHub's cache. Tauri's build
      # scripts re-run when the CLI and Gradle (or the two macOS targets)
      # build with different settings, so cargo's own target folder holds one
      # variant at a time; sccache keeps them all.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux
          # Keep what compiled even when a later step fails.
          cache-on-failure: true

      # Bun's package cache, keyed on the lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v6
        with:
          name: my-book-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # Adds the Linux builds to the "latest" release, creating it if this job finishes first.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automated builds from main. Updated on every push." || \
            gh release view latest >/dev/null
          gh release upload latest \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber

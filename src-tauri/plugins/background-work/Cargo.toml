[package]
name = "tauri-plugin-background-work"
version = "0.1.0"
description = "Work that carries on with the app out of sight: an Android foreground service, and on computers no sleeping from idleness"
edition = "2021"
links = "tauri-plugin-background-work"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.rust]
# No unsafe Rust; see CLAUDE.md.
# Spec: engineering-rules.TYP-5
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(mobile)',
  'cfg(desktop)',
] }

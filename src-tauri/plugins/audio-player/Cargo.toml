[package]
name = "tauri-plugin-audio-player"
version = "0.1.0"
description = "Recordings played on Android through Media3: screen off, lock-screen, notification and headphone controls"
edition = "2021"
links = "tauri-plugin-audio-player"

[dependencies]
tauri = { version = "2" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.rust]
# No unsafe Rust; see CLAUDE.md.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(mobile)',
  'cfg(desktop)',
] }

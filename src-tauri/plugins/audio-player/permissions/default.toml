"$schema" = "schemas/schema.json"

[default]
description = "Playing recordings: the controls, and its state (the queue is set by the app's Rust)."
permissions = [
  "allow-play",
  "allow-pause",
  "allow-toggle",
  "allow-seek-to",
  "allow-set-speed",
  "allow-stop",
  "allow-get-state",
  "allow-register-listener",
  "allow-remove-listener",
]

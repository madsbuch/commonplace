[package]
name = "tauri-plugin-page-render"
version = "0.1.0"
description = "A web page as it shows once its scripts have run, from an off-screen Android WebView"
edition = "2021"
links = "tauri-plugin-page-render"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.rust]
# No unsafe Rust; see CLAUDE.md.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(mobile)',
  'cfg(desktop)',
] }

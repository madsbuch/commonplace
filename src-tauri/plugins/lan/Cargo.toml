[package]
name = "tauri-plugin-lan"
version = "0.1.0"
description = "Finding the book's devices on the local network: Android NSD and desktop mDNS (ported from Murmur)"
edition = "2021"
links = "tauri-plugin-lan"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mdns-sd = { version = "0.21.7", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.rust]
# No unsafe Rust; see CLAUDE.md.
# Spec: keel.TYP-5
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(mobile)',
  'cfg(desktop)',
] }
